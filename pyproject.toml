[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "onlinesimru"
version = "3.1.0"
description = "Typed, zero-dependency Python client for the OnlineSim API: SMS numbers, rent, account and free numbers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "s00d", email = "suppport@onlinesim.ru" }]
keywords = ["sms", "receive", "onlinesim", "onlinesim-ru", "autoreg", "virtual number"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/s00d/onlinesim-python-api"
Documentation = "https://s00d.github.io/onlinesim-python-api/"
Repository = "https://github.com/s00d/onlinesim-python-api"
Issues = "https://github.com/s00d/onlinesim-python-api/issues"
Changelog = "https://github.com/s00d/onlinesim-python-api/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["onlinesimru"]

[tool.hatch.build.targets.sdist]
include = ["onlinesimru", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "A", "S", "SIM", "RUF"]
ignore = [
    "UP006", "UP007", "UP035", "UP045", # typing.List/Optional/Union: annotations stay valid at runtime on 3.9
    "A004", # `TimeoutError` is the contract's name; ours also subclasses the built-in one
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["onlinesimru", "tests"]
